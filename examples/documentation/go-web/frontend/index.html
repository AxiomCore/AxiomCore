<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Go and AxiomCore</title>
  <style>
    body { margin: 0; background: #0a0a0a; color: #eee; font: 16px system-ui, sans-serif; }
    main { max-width: 680px; padding: 48px 24px; margin: auto; }
    .eyebrow { color: #ff6a3d; font-size: 12px; letter-spacing: .08em; }
    h1 { font-size: 36px; line-height: 1.15; }
    p { color: #b3b3b3; line-height: 1.6; }
    form { display: flex; gap: 12px; margin-top: 32px; }
    input, button { font: inherit; padding: 12px; border: 1px solid #555; }
    input { background: #171717; color: #fff; min-width: 0; flex: 1; }
    button { background: #ff3d00; color: white; cursor: pointer; }
    output { display: block; padding: 24px; margin-top: 24px; border: 1px solid #404040; font-size: 22px; }
    @media (max-width: 480px) { form { flex-direction: column; } h1 { font-size: 28px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">EXISTING STACK · GO + ATMX</p>
    <h1>Your backend.<br />A shared contract.</h1>
    <p>Keep Go on the server and ordinary web code in the browser. AxiomCore connects their typed boundary.</p>
    <form id="greeting">
      <input id="name" aria-label="Your name" value="Ada" maxlength="40" required />
      <button id="submit" type="submit" disabled>Say hello</button>
    </form>
    <output id="result" aria-live="polite">Starting the contract runtime...</output>
  </main>
  <script type="module" src="/main.ts"></script>
</body>
</html>
