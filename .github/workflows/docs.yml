name: Documentation

on:
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'examples/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'examples/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Policy, types, build, and routes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate documentation release
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm check

      - name: Retain documentation release manifest
        uses: actions/upload-artifact@v4
        with:
          name: docs-release-manifest-${{ github.sha }}
          path: docs/artifacts/docs-release-manifest.json
          if-no-files-found: error
          retention-days: 30
