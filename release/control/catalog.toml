format = "axiom-platform-release-catalog/v1"

# Paths are relative to the local multi-repository workspace. CI checks out
# these repositories as siblings before asking the planner for a release plan.
[repositories]
"acore-diff" = "."
AxiomCore = "AxiomCore"
acore = "acore"
"axiom-backend" = "axiom-backend"
"axiom-build" = "axiom-build"
"axiom-cloud" = "axiom-cloud"
"axiom-extractor" = "axiom-extractor"
"axiom-frontend" = "axiom-frontend"
"axiom-lib" = "axiom-lib"
"axiom-mock" = "axiom-mock"
"axiom-runtime" = "axiom-runtime"
"axiom-sdk" = "axiom-sdk"
"atmx-web" = "axiom-sdk/web/atmx"
"atmx-react" = "axiom-sdk/web/atmx-react"
"axiom-test-runner" = "axiom-test-runner"
"axiom-ui" = "axiom-ui"
"axiom-ui-host" = "axiom-ui-host"
rod = "rod"

[[components]]
id = "cli"
owner = "AxiomCore"
kind = "binary"
version = "cli/Cargo.toml"
adapter = "cli"
destination = "GitHub Releases: AxiomCore/AxiomCore"
sources = [
  { repo = "AxiomCore", paths = ["cli/"] },
  { repo = "acore", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "acore-diff", paths = ["acore-diff/src/", "acore-diff/Cargo.toml", "acore-diff/Cargo.lock"] },
  { repo = "axiom-build", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-cloud", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-extractor", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-lib", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-mock", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-runtime", paths = ["extensions/", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-test-runner", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-ui", paths = ["src/", "Cargo.toml", "Cargo.lock", "registry/"] },
]

[[components]]
id = "runtime-apple"
owner = "axiom-runtime"
kind = "framework"
adapter = "ci-only"
destination = "GitHub Releases: AxiomCore/AxiomCore"
sources = [
  { repo = "axiom-runtime", paths = ["src/", "extensions/", "include/", "scripts/generate-ffi-header.sh", "cbindgen.toml", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-lib", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "rod", paths = ["core/", "macros/", "Cargo.lock"] },
  { repo = "AxiomCore", paths = ["release/scripts/build_apple.sh"] },
]

[[components]]
id = "ui-host-web"
owner = "axiom-ui-host"
kind = "host"
adapter = "host-web"
required_artifacts = ["axiom-ui-host-web-browser.zip"]
destination = "GitHub Releases: AxiomCore/axiom-ui-host"
sources = [
  { repo = "axiom-ui-host", paths = ["web/", "toolchain/", "scripts/build-web.sh", "scripts/lib.sh"] },
  { repo = "axiom-runtime", paths = ["src/", "extensions/", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-lib", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "rod", paths = ["core/", "macros/", "Cargo.lock"] },
]

[[components]]
id = "ui-host-android"
owner = "axiom-ui-host"
kind = "host"
adapter = "host-android"
required_artifacts = ["axiom-ui-host-android-emulator.apk"]
destination = "GitHub Releases: AxiomCore/axiom-ui-host"
sources = [
  { repo = "axiom-ui-host", paths = ["android/", "toolchain/", "scripts/build-android.sh", "scripts/lib.sh"] },
  { repo = "axiom-runtime", paths = ["src/", "extensions/", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-lib", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "rod", paths = ["core/", "macros/", "Cargo.lock"] },
]

[[components]]
id = "ui-host-ios"
owner = "axiom-ui-host"
kind = "host"
adapter = "host-ios"
required_artifacts = ["axiom-ui-host-ios-simulator.app.zip"]
destination = "GitHub Releases: AxiomCore/axiom-ui-host"
sources = [
  { repo = "axiom-ui-host", paths = ["ios/", "toolchain/", "scripts/build-ios.sh", "scripts/lib.sh"] },
  { repo = "axiom-runtime", paths = ["src/", "extensions/", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-lib", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "rod", paths = ["core/", "macros/", "Cargo.lock"] },
]

[[components]]
id = "sdk-atmx-web"
owner = "atmx-web"
kind = "npm"
version = "package.json"
adapter = "ci-only"
destination = "npm: atmx-web; Cloudflare R2 versioned objects"
sources = [
  { repo = "atmx-web", paths = ["src/", "package.json", "package-lock.json", "vite.config.ts"] },
  { repo = "axiom-runtime", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-lib", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "rod", paths = ["core/", "macros/", "Cargo.lock"] },
  { repo = "AxiomCore", paths = ["release/scripts/wasm.sh"] },
]

[[components]]
id = "sdk-atmx-react"
owner = "atmx-react"
kind = "npm"
version = "package.json"
adapter = "ci-only"
destination = "npm: atmx-react"
depends_on = ["sdk-atmx-web"]
sources = [{ repo = "atmx-react", paths = ["src/", "package.json", "package-lock.json", "tsup.config.ts"] }]

[[components]]
id = "sdk-atmx-cli"
owner = "AxiomCore"
kind = "npm"
version = "release/atmx-cli/package.json"
adapter = "ci-only"
destination = "npm: atmx-cli"
sources = [{ repo = "AxiomCore", paths = ["release/atmx-cli/"] }]

[[components]]
id = "sdk-flutter-generator"
owner = "axiom-sdk"
kind = "pub"
version = "flutter/axiom_flutter_generator/pubspec.yaml"
adapter = "ci-only"
destination = "pub.dev: axiom_flutter_generator"
sources = [
  { repo = "axiom-sdk", paths = ["flutter/axiom_flutter_generator/"] },
]

[[components]]
id = "sdk-flutter"
owner = "axiom-sdk"
kind = "pub"
version = "flutter/axiom_flutter/pubspec.yaml"
adapter = "ci-only"
destination = "pub.dev: axiom_flutter"
depends_on = ["runtime-apple"]
sources = [
  { repo = "axiom-sdk", paths = ["flutter/axiom_flutter/"] },
  { repo = "axiom-runtime", paths = ["src/", "extensions/", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-lib", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "rod", paths = ["core/", "macros/", "Cargo.lock"] },
  { repo = "AxiomCore", paths = ["release/scripts/wasm.sh"] },
]

[[components]]
id = "sdk-swift"
owner = "axiom-sdk"
kind = "swift-package"
adapter = "ci-only"
destination = "Git source tag with immutable XCFramework checksum"
depends_on = ["runtime-apple"]
sources = [{ repo = "axiom-sdk", paths = ["swift/"] }]

[[components]]
id = "backend-api"
owner = "axiom-backend"
kind = "service"
adapter = "ci-only"
destination = "Artifact Registry digest; Cloud Run API revision"
sources = [{ repo = "axiom-backend", paths = ["cmd/api/", "internal/", "db/", "go.mod", "go.sum", "Dockerfile", "scripts/deploy-cloud-run.sh"] }]

[[components]]
id = "extractor-fastapi"
owner = "axiom-extractor"
kind = "binary"
version = "extractors/python/frameworks/axiom_fastapi/pyproject.toml"
adapter = "ci-only"
destination = "GitHub Releases: AxiomCore/AxiomCore; axiom-fastapi platform binaries"
sources = [
  { repo = "axiom-extractor", paths = ["extractors/python/frameworks/axiom_fastapi/src/", "extractors/python/frameworks/axiom_fastapi/build_entrypoint.py", "extractors/python/frameworks/axiom_fastapi/pyproject.toml", "extractors/python/frameworks/axiom_fastapi/poetry.lock", "extractors/python/frameworks/axiom_fastapi/axiom-fastapi.spec"] },
  { repo = "AxiomCore", paths = ["release/extractors/scripts/publish.sh"] },
]

[[components]]
id = "extractor-go"
owner = "axiom-extractor"
kind = "binary"
adapter = "ci-only"
destination = "GitHub Releases: AxiomCore/AxiomCore; axiom-go-extractor platform binaries"
sources = [
  { repo = "axiom-extractor", paths = ["extractors/go/cmd/", "extractors/go/internal/", "extractors/go/go.mod", "extractors/go/go.sum"] },
  { repo = "AxiomCore", paths = ["release/extractors/scripts/publish.sh"] },
]

[[components]]
id = "backend-worker"
owner = "axiom-backend"
kind = "job"
adapter = "ci-only"
destination = "Artifact Registry digest; Cloud Run release-worker Job"
sources = [
  { repo = "axiom-backend", paths = ["cmd/worker/", "internal/", "go.mod", "go.sum", "Dockerfile.semantic-worker", "cloudbuild.semantic-worker.yaml", "scripts/deploy-cloud-run.sh"] },
  { repo = "acore", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "acore-diff", paths = ["acore-diff/src/", "acore-diff/Cargo.toml", "acore-diff/Cargo.lock"] },
  { repo = "axiom-lib", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-ui", paths = ["src/", "registry/", "Cargo.toml", "Cargo.lock"] },
]

[[components]]
id = "mock-runner"
owner = "axiom-backend"
kind = "image"
adapter = "ci-only"
destination = "Artifact Registry immutable digest; managed tag is a pointer"
sources = [
  { repo = "axiom-backend", paths = ["Dockerfile.mock-runner", "cloudbuild.mock-runner.yaml", "scripts/deploy-cloud-run.sh"] },
  { repo = "axiom-mock", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
]

[[components]]
id = "contract-test-runner"
owner = "axiom-backend"
kind = "job"
adapter = "ci-only"
destination = "Artifact Registry digest; Cloud Run contract-test Job"
sources = [
  { repo = "axiom-backend", paths = ["Dockerfile.contract-test-runner", "cloudbuild.contract-test-runner.yaml", "scripts/deploy-cloud-run.sh"] },
  { repo = "acore", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-test-runner", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-lib", paths = ["src/", "Cargo.toml", "Cargo.lock"] },
  { repo = "axiom-ui", paths = ["src/", "registry/", "Cargo.toml", "Cargo.lock"] },
]

[[components]]
id = "dashboard-origin"
owner = "axiom-frontend"
kind = "service"
adapter = "ci-only"
destination = "Artifact Registry digest; Cloud Run dashboard revision"
sources = [{ repo = "axiom-frontend", paths = ["apps/dashboard/", "packages/", "lib/", "package.json", "pnpm-lock.yaml", "Dockerfile.dashboard", "cloudbuild.dashboard.yaml", "scripts/deploy-cloud-run.sh"] }]

[[components]]
id = "dashboard-proxy"
owner = "axiom-frontend"
kind = "edge"
adapter = "ci-only"
destination = "Cloudflare Pages dashboard proxy"
sources = [{ repo = "axiom-frontend", paths = ["scripts/deploy-cloudflare.sh"] }]

[[components]]
id = "docs"
owner = "AxiomCore"
kind = "site"
adapter = "ci-only"
destination = "Cloudflare Pages documentation"
sources = [{ repo = "AxiomCore", paths = ["docs/", "README.md", "CONTRIBUTING.md"] }]
