name: Release control validation

on:
  pull_request:
    paths:
      - .github/workflows/release-control.yml
      - justfile
      - release/control/**
  push:
    paths:
      - .github/workflows/release-control.yml
      - justfile
      - release/control/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release catalog and planner
        run: python -B -m unittest discover -s release/control -p 'test_*.py' -v
